  <rect width="120" height="120" fill="#FFFFFF"/>
  <polyline points="4,26 22,38 34,34 50,56 70,62 84,80 100,84 116,106" fill="none" stroke="#141414" stroke-width="2.5" stroke-linejoin="miter"/>
  <circle cx="60" cy="60" r="30" fill="#FFFFFF" stroke="#141414" stroke-width="6"/>
  <g clip-path="url(#lens)">
    <polyline points="4,26 22,38 34,34 50,56 70,62 84,80 100,84 116,106" fill="none" stroke="#141414" stroke-width="2.5" stroke-linejoin="miter" transform="translate(60 60) scale(1.9) translate(-60 -60)"/>
  </g>
</svg>
